
services:
  portfolio:
    image: docker.io/${DOCKERHUB_USERNAME}/portfolio-nextjs:${IMAGE_TAG:-latest}
    container_name: portfolio-nextjs
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
